name: PartyNet tests

on:
  pull_request:
    paths:
      - 'PartyNet/**'
      - '.github/workflows/party-net-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'PartyNet/**'
      - '.github/workflows/party-net-tests.yml'

permissions:
  contents: read

jobs:
  swift-tests:
    name: Gameplay and protocol regressions on macOS
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Run gameplay and protocol regressions
        # Run the full timing-sensitive network suite with scripts/verify.sh on a development Mac.
        run: >-
          swift test --package-path PartyNet --no-parallel
          --filter 'PartyGamesTests|drawHistoryUsesAnAdditivePresentationCase|UDPDelayKeepsPendingWorkBoundedPerSession'
