name: Static checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-static-checks:
    name: Linux-safe repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install --yes shellcheck rsync

      - name: Check Bash syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Run ShellCheck
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Test golden fixture recording safety
        run: bash scripts/tests/record-goldens-test.sh

      - name: Test distribution workflow
        run: bash scripts/tests/distribute-test.sh

      - name: Validate JSON configuration and test plans
        run: |
          while IFS= read -r -d '' document; do
            jq empty "$document"
          done < <(find TestPlans .codex -type f \( -name '*.json' -o -name '*.xctestplan' \) -print0)

      - name: Explain platform coverage
        run: >-
          echo "Changes to PartyNet or its test workflow also run Swift package tests on hosted macOS.
          The full transport suite and Apple app and simulator tests run through scripts/verify.sh normal on a development Mac."
